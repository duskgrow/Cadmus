[package]
name = "cadmus"
description = "Self-evolving coding agent: self-built loop, OpenAI-compatible dialects, read-only coding tools (phase 0)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

# the GitHub Release body is generated from this changelog's matching section
# (module-grouped per the [changelog] config in release-plz.toml)
[package.metadata.dist]
changelog = "../../CHANGELOG.md"

[dependencies]
cadmus-contract.workspace = true
cadmus-core.workspace = true
cadmus-llm-openai.workspace = true
cadmus-memory.workspace = true
async-trait.workspace = true
clap.workspace = true
thiserror.workspace = true
miette.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[dev-dependencies]
insta.workspace = true
assert_cmd.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
