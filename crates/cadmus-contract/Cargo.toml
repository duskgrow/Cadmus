[package]
name = "cadmus-contract"
description = "Port traits, wire types, Capabilities and ModelProfile — the only crate where serializable boundary types live (ADR-0002/0003)"
# Internal crates carry no semver burden. To publish later, switch to
# version.workspace = true, drop publish = false, and register the package
# in release-plz.toml — see CONTRIBUTING.md.
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio-stream.workspace = true
