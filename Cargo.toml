# ============================================================================
# The root Cargo.toml is this repository's three-in-one SSOT:
#   1. [workspace.dependencies] — third-party versions live ONLY here; member
#      crates inherit via workspace = true (they may only add features/optional);
#   2. [workspace.package]      — version, edition, license, ... declared once;
#   3. [workspace.lints]        — lint policy declared once; members inherit via
#      [lints] workspace = true, CI escalates it to hard errors with -D warnings.
# ============================================================================
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/duskgrow/cadmus"
homepage = "https://github.com/duskgrow/cadmus"

[workspace.dependencies]
# ---- runtime dependencies ----
clap = { version = "4", features = ["derive"] }
thiserror = "2"
# the `fancy` renderer may only appear in the final binary (top-level crate);
# library crates should depend on plain miette instead
miette = { version = "7", features = ["fancy"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = "1"
serde_json = "1"
tokio = "1"
tokio-stream = "0.1"
async-trait = "0.1"
# thin LLM client (repo: jeremychone/rust-genai). Beware: crates.io also hosts
# an unrelated Gemini-only crate literally named `rust-genai` — not this one.
genai = "0.6.5"
# ripgrep's library crates back the `grep` and `list_dir` tools:
# gitignore-aware walking + hidden/symlink policy (`ignore`), Unicode regex
# (`grep-regex`), line-oriented search with binary detection (`grep-searcher`).
# The UTF-8-only policy lives in the tool's search setup (per-line sink
# check, BOM sniffing off), not in feature flags; default-features = false
# is a pin against future defaults, not a selection.
ignore = { version = "0.4", default-features = false }
grep-regex = "0.1"
grep-searcher = { version = "0.1", default-features = false }
# unified diffs in the write tools' results (execution-verification feedback,
# ADR-0008 item 5); insta's snapshot diffing already trusts this crate
similar = { version = "2", default-features = false, features = ["text"] }
# civil date/time rendering (the trailer's local-time clock) and the trace-id
# shard date: std offers epoch arithmetic only — no civil calendar, no
# timezone database. Never hand-roll calendar math (maintainer, 2026-09-10).
time = { version = "0.3", default-features = false }

# ---- TUI stack (admission record: ADR-0018 item 1, crates.io-verified 2026-09-13) ----
# MSRV is exactly 1.88.0 — zero headroom: `just toolchain-bump` must check
# ratatui's published MSRV before raising ours. crossterm_0_29 pins the
# backend to the crossterm line we depend on directly.
# unstable-rendered-line-info exposes Paragraph::line_count/line_width: the
# stream widget measures wrapped heights with ratatui's own WordWrapper, so
# flush rows, band rendering and height math share one wrap implementation
# (the same feature Codex enables; version-pinned, and the ratatui-bump open
# item already re-verifies the inline-viewport area on upgrades).
ratatui = { version = "0.30", features = ["crossterm_0_29", "unstable-rendered-line-info"] }
# terminal IO + the async event stream; slow release line but an active repo —
# maintainer-signed staleness exception in ADR-0018 item 1
crossterm = { version = "0.29", features = ["event-stream"] }
# streaming-markdown parser: full reparse per chunk, offset_iter as a later
# optimization (ADR-0018 item 4); defaults off cut the binary/html paths
pulldown-cmark = { version = "0.13", default-features = false }
# code-fence highlighting on bat's syntax/theme corpus via the pure-Rust
# fancy-regex engine (no C toolchain); syntect's bundled dumps stay off —
# two-face's corpus is strictly larger. Staleness exceptions signed in
# ADR-0018 item 1.
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
# picker scoring (@ completion, command palette): 1.5k-line pure algorithm,
# "finished, not abandoned" — staleness exception signed in ADR-0018 item 1
fuzzy-matcher = "0.3"
unicode-width = "0.2"
unicode-segmentation = "1"
# human-maintained config (settings / keymap / theme) is TOML data; machine
# boundaries (event stream, socket protocol) stay JSON (ADR-0018 item 7)
toml = "1"

# ---- internal crates ----
cadmus-contract = { path = "crates/cadmus-contract" }
cadmus-core = { path = "crates/cadmus-core" }
cadmus-llm-openai = { path = "crates/cadmus-llm-openai" }
cadmus-memory = { path = "crates/cadmus-memory" }
cadmus-transport = { path = "crates/cadmus-transport" }
cadmus-tui = { path = "crates/cadmus-tui" }
cadmus-ui = { path = "crates/cadmus-ui" }

# ---- dev dependencies ----
insta = "1"
assert_cmd = "2"
# virtual terminal for TUI snapshot tests: asserts the final screen AND the
# scrollback, which ratatui's TestBackend has no concept of (ADR-0018 item 9)
vt100 = "0.16"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# pedantic rules whose noise outweighs their value for a bin + internal-lib shape:
missing_errors_doc = "allow" # error docs are carried by miette Diagnostic (code/help)
missing_panics_doc = "allow"
module_name_repetitions = "allow"

# release artifacts are built cross-platform by cargo-dist; give distributed
# binaries a solid optimization level
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
