# Dependabot covers both ecosystems, grouped weekly to keep PR noise down:
# - cargo: workspace dependencies (versions only ever change in the root
#   [workspace.dependencies])
# - github-actions: keeps the SHA-pinned actions fresh
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
