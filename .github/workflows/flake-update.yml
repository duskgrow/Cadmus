# Weekly automated flake.lock upgrade PRs (keeps the toolchain/ecosystem SSOT fresh).
# Caveat: PRs opened with the default GITHUB_TOKEN do not trigger CI (GitHub's
# recursion guard) — if CI must run on those PRs, supply a GitHub App token via
# secrets (`token:`), or push an empty commit manually.
name: update flake.lock

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1" # Mondays

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    # runs only in the generated project (init substitutes the real owner into
    # the guard); skipped in forks and in the template repository itself
    if: github.repository_owner == 'duskgrow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          pr-title: "chore(deps): update flake.lock"
