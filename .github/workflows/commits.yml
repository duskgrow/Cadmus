# Commit messages are the version-intent SSOT (modified Conventional Commits —
# the input release-plz derives versions and the changelog from). Squash merge
# makes the PR title+body the landed commit message, so the PR title is what
# gets checked here; the commit-msg hook covers local commits.
# A separate workflow so `edited` re-runs only this cheap check, not ci.yml's
# whole test matrix: retitling a PR (e.g. dependabot's "Bump ..." titles)
# re-triggers the gate automatically.
name: commits

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commits:
    name: conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      # via env vars, never interpolated into shell (the title is user-controlled)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cmd-format: nix develop -c {0}
      - env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > pr-message.txt
          nix develop -c cargo run -q -p xtask -- check-commit pr-message.txt
