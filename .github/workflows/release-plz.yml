# Release pipeline: Release PR (machine-prepared, human-gated) → on merge,
# automatic tag → cargo-dist's GitHub Release (binaries + installers).
# crates.io publishing is OPT-IN: generated projects run git-only (see
# release-plz.toml), never contacting a cargo registry or holding any credential
# until the owner enables it (CONTRIBUTING.md "Releasing").
#
# One-time repository setup: GitHub Settings → Actions → General → Workflow
# permissions: Read and write + "Allow GitHub Actions to create and approve
# pull requests" (without it the Release PR cannot be opened).
name: release-plz

on:
  push:
    branches: [main]

jobs:
  # Machine computes the version, writes the changelog, runs semver-checks and
  # keeps a ready-to-merge Release PR open
  release-pr:
    name: release-plz PR
    # skipped in forks and in the template repository itself (duskgrow
    # is replaced with the real owner by init)
    if: github.repository_owner == 'duskgrow'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push release-plz- branches
      pull-requests: write # open the Release PR
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (infers rust-toolchain.toml)
      - uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # After the Release PR is merged: push the tag (which triggers cargo-dist's
  # release.yml). crates.io publish joins only after the opt-in setup.
  release:
    name: release-plz release
    if: github.repository_owner == 'duskgrow'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push tags
      pull-requests: read # detect the merged Release PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
