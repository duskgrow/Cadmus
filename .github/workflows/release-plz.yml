# Release pipeline: Release PR (machine-prepared, human-gated) → on merge,
# automatic tag + crates.io publish. No long-lived tokens: crates.io publishing
# uses OIDC Trusted Publishing (short-lived, scoped tokens).
#
# One-time repository setup (see CONTRIBUTING.md "Releasing"):
#   1. GitHub Settings → Actions → General:
#      - Workflow permissions: Read and write
#      - Check "Allow GitHub Actions to create and approve pull requests"
#   2. First publish must be manual (`cargo publish` once) — Trusted Publishing
#      can only bind to an existing crate
#   3. crates.io → crate → Settings → Trusted Publishing: register this
#      repository + this workflow's filename
name: release-plz

on:
  push:
    branches: [main]

jobs:
  # Machine computes the version, writes the changelog, runs semver-checks and
  # keeps a ready-to-merge Release PR open
  release-pr:
    name: release-plz PR
    # skipped in forks and in the template repository itself (__GITHUB_OWNER__
    # is replaced with the real owner by init)
    if: github.repository_owner == '__GITHUB_OWNER__'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push release-plz- branches
      pull-requests: write # open the Release PR
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (infers rust-toolchain.toml)
      - uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # After the Release PR is merged: push the tag (which triggers cargo-dist's
  # release.yml) + publish to crates.io
  release:
    name: release-plz release
    if: github.repository_owner == '__GITHUB_OWNER__'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push tags
      pull-requests: read # detect the merged Release PR
      id-token: write # crates.io OIDC Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Deliberately NO CARGO_REGISTRY_TOKEN: without it, release-plz
          # automatically uses OIDC Trusted Publishing
