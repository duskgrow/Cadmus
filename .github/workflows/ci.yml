# Thin CI orchestration layer: triggers / matrix / permissions / caches only.
# All logic lives in the justfile — reproduce any CI failure locally with
#   nix develop -c just ci        (native Windows: just ci,
#                                  consuming the same rust-toolchain.toml / Cargo.lock)
# Third-party actions are pinned to full commit SHAs; dependabot keeps them fresh.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group: # required so merge-queue runs actually trigger the status checks

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runs the same .pre-commit-config.yaml as local git hooks; CI only changes
  # the file scope (all files, read-only)
  quality-gate:
    name: quality gate (prek)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      # zero-config binary cache; for stricter requirements switch to FlakeHub
      # Cache or Cachix (see docs/decisions/0004)
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      # cargo registry + target/ cache; cmd-format routes rustc/cargo through the
      # nix devShell (no ambient rustc exists in nix jobs)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cmd-format: nix develop -c {0}
      - run: nix develop -c prek run --all-files --show-diff-on-failure

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cmd-format: nix develop -c {0}
      - run: nix develop -c just ci

  # Nix has no native Windows support: this job takes the rustup native route
  # (the runner ships rustup, which auto-installs the pinned toolchain on first
  # cargo invocation) — no parallel environment description is maintained.
  test-windows:
    name: test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: nextest,just,cargo-deny
      # actionlint is not in install-action's manifest (its cargo-binstall
      # fallback fails for a Go tool); the runner ships Go, so install directly
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@latest
      - run: echo "$(go env GOPATH)\bin" >> $env:GITHUB_PATH
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: just ci

  # Commit messages are the version-intent SSOT (modified Conventional Commits —
  # the input release-plz derives versions and the changelog from). Squash merge
  # makes the PR title+body the landed commit message, so the PR title is what
  # gets checked here; the commit-msg hook covers local commits.
  commits:
    name: conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      # via env vars, never interpolated into shell (the title is user-controlled)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cmd-format: nix develop -c {0}
      - env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > pr-message.txt
          nix develop -c cargo run -q -p xtask -- check-commit pr-message.txt

  # release.yml is generated by `dist generate`: fail on hand edits or drift
  # from dist-workspace.toml
  dist-drift:
    name: release.yml drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      - run: nix develop -c just dist-check

  # >>> template-only: template self-test — run the full init → just ci flow in a
  # temp dir so template rot is caught by the template's own CI; removed by `just init`
  smoke-init:
    name: smoke (init → ci)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      # cargo registry + the smoke project's target dir (built in /tmp, outside
      # the checkout — rust-cache's workspace discovery does not cover it)
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/smoke-app/target
          key: ${{ runner.os }}-smoke-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-smoke-cargo-
      - run: |
          mkdir -p /tmp/smoke-app
          # contents-merge (not `cp -r "$PWD" /tmp/smoke-app`): the cargo cache
          # above may have already restored /tmp/smoke-app/target, and cp into
          # an existing dir would nest the checkout as a subdirectory
          cp -r "$PWD"/. /tmp/smoke-app/
          cd /tmp/smoke-app
          rm -rf .git
          nix develop -c just init smoke-app smoke-owner
          nix develop -c just ci
          nix develop -c just dist-check
          # no template-authored commit: HEAD unborn, whole tree staged, nothing else
          ! git rev-parse -q --verify HEAD && git status --porcelain | grep -q '^A ' && ! git status --porcelain | grep -qv '^A '
          ! grep -rI "__project_name__" --exclude-dir=.git --exclude-dir=target .
  # <<< template-only
