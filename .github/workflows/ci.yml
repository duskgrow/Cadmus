# Thin CI orchestration layer: triggers / matrix / permissions / caches only.
# All logic lives in the justfile — reproduce any CI failure locally with
#   nix develop -c just ci        (native Windows: just ci,
#                                  consuming the same rust-toolchain.toml / Cargo.lock)
# Third-party actions are pinned to full commit SHAs; dependabot keeps them fresh.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group: # required so merge-queue runs actually trigger the status checks

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runs the same .pre-commit-config.yaml as local git hooks; CI only changes
  # the file scope (all files, read-only)
  quality-gate:
    name: quality gate (prek)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      # The nix store caches on Cachix (public cache `cadmus`), cargo artifacts
      # stay on the GitHub Actions cache below — the 10 GB GHA quota then holds
      # cargo only, which fits comfortably (nix store closures do not).
      # PRs read the public cache; only main/merge-queue pushes (which needs
      # the CACHIX_AUTH_TOKEN secret).
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: cadmus
          skipPush: ${{ github.event_name == 'pull_request' }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # cargo registry + target/ cache. Not rust-cache: its key detection shells
      # out through `nix develop -c` (~75s of flake eval per job); a static key
      # over the lockfile + toolchain pin expresses the same identity instantly.
      # (test-windows keeps rust-cache: rustup is native there, detection free.)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: v0-rust-${{ github.job }}-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: v0-rust-${{ github.job }}-${{ runner.os }}-
      - run: nix develop -c prek run --all-files --show-diff-on-failure

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: cadmus
          skipPush: ${{ github.event_name == 'pull_request' }} # see the quality-gate job
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # cargo registry + target/ cache; actions/cache over rust-cache for the
      # same reason as the quality-gate job (no `nix develop -c` detection tax)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: v0-rust-${{ github.job }}-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: v0-rust-${{ github.job }}-${{ runner.os }}-
      - run: nix develop -c just ci

  # Nix has no native Windows support: this job takes the rustup native route
  # (the runner ships rustup, which auto-installs the pinned toolchain on first
  # cargo invocation) — no parallel environment description is maintained.
  test-windows:
    name: test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2
        with:
          tool: nextest,just,cargo-deny,dprint
      # actionlint is not in install-action's manifest (its cargo-binstall
      # fallback fails for a Go tool); the runner ships Go, so install directly
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@latest
      - run: echo "$(go env GOPATH)\bin" >> $env:GITHUB_PATH
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: just ci

  # release.yml is generated by `dist generate`: fail on hand edits or drift
  # from dist-workspace.toml
  dist-drift:
    name: release.yml drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: cadmus
          skipPush: ${{ github.event_name == 'pull_request' }} # see the quality-gate job in ci.yml
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix develop -c just dist-check
