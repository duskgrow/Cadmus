name: Feature Request
description: Propose a new capability or behavior
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        中文或英文填写均可 / Chinese or English both welcome.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the pain point, not the solution — what are you unable to do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like to see. Sketches of CLI/API shape welcome.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other approaches you have evaluated.
    validations:
      required: false
