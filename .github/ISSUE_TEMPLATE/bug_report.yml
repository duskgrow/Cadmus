name: Bug Report
description: Report something that is broken
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in what you can — a reproduction is
        worth a thousand words. 中文或英文填写均可 / Chinese or English both welcome.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: false
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal commands/steps; include the full command output where relevant.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `--version`, or the git commit if built from source.
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows (native)
        - Windows (WSL2)
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / diagnostics
      description: stderr output, error reports (with code/help sections), backtraces.
      render: text
    validations:
      required: false
