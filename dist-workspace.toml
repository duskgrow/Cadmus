# cargo-dist: push a v* tag → cross-platform matrix build → GitHub Release +
# installers + attestations.
# Config reference: https://opensource.axo.dev/cargo-dist/book/reference/config.html
#
# .github/workflows/release.yml is generated by `dist generate` — never
# hand-edit it. After changing this file, run `just dist-check` to confirm the
# generated file is in sync (CI runs the same drift check).
[workspace]
members = ["cargo:."]

[dist]
# Pins the generator version; release CI downloads exactly this one.
# Keep in sync with the cargo-dist provided by the devShell (nixpkgs).
# Upgrade: change this + `nix flake update`, then run `dist generate` and commit release.yml.
cargo-dist-version = "0.32.0"
ci = ["github"]
installers = ["shell", "powershell"]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
# run `dist plan` on PRs: regressions in the release pipeline surface before merge
pr-run-mode = "plan"
# GitHub Artifact Attestations (SLSA L2): users can verify provenance with
# `gh attestation verify`
github-attestations = true

# third-party actions inside the generated release.yml are pinned to full SHAs too
[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6" # v4
