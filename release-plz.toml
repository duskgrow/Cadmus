# release-plz: Conventional Commits → Release PR (human gate) → tag on merge →
# cargo-dist GitHub Release. crates.io publishing is OPT-IN — see [workspace]
# below and CONTRIBUTING.md "Releasing".
# Config reference: https://release-plz.dev/docs/config
[workspace]
# new crates are NOT managed by release-plz unless registered as [[package]] below
release = false
# the Release PR is the human gate: without this, release-plz release would tag
# (and dist would publish a GitHub Release) on the very first push to main
release_always = false
# crates.io publishing is opt-in: git_only tracks versions from git tags and
# never contacts a cargo registry, for every managed package (git_only forbids
# publish = true). To opt in: drop both lines and follow CONTRIBUTING.md
# "Releasing" (per-package overrides exist for mixed setups).
git_only = true
publish = false
# tag format aligned with cargo-dist's trigger (v*)
git_tag_name = "v{{ version }}"
# the GitHub Release (with cross-platform binaries and installers) is created
# by cargo-dist — release-plz must not create a second one
git_release_enable = false
# The Release PR body is also the squash-merge commit body (repo setting
# PR_TITLE/PR_BODY): keep it commit-clean by construction — no HTML comments
# (check-commit rejects them), no <details> scaffolding, no generator footer.
pr_body = """
{%- for release in releases %}
{%- if releases | length > 1 -%}
## `{{ release.package }}`
{% endif -%}
{%- if release.title and release.changelog -%}
## {{ release.title }}
{% if release.semver_check == "incompatible" -%}
> ⚠ cargo-semver-checks: API breaking changes
{% elif release.semver_check == "compatible" -%}
> cargo-semver-checks: API compatible
{% endif -%}
{{ release.changelog }}
{%- if release.breaking_changes %}
### ⚠ breaking changes

```text
{{ release.breaking_changes }}
```
{%- endif %}
{%- endif %}
{% endfor -%}
"""
# changelog: generated from commit messages, grouped by module (the commit
# convention's scope). Never hand-edit released sections.
[changelog]
commit_parsers = [
    # scoped commits get their own module section (Zed-style release notes)
    { message = '^(\w+)\(([^)]+)\)', group = "${2}" },
    # unscoped commits fall back to type groups
    { message = "^feat", group = "features" },
    { message = "^fix", group = "fixes" },
    { message = "^security", group = "security" },
    { message = "^.*", group = "other" },
]
body = """
## [{{ version }}]{%- if release_link -%}({{ release_link }}){% endif %}{%- if timestamp %} - {{ timestamp | date(format="%Y-%m-%d") }}{% endif %}
{% for group, commits in commits | group_by(attribute="group") -%}
### {{ group | upper_first }}
{% for commit in commits -%}
- {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message }}{%- if commit.links %} ({% for link in commit.links %}[{{ link.text }}]({{ link.href }}) {% endfor %}){% endif %}
{% endfor -%}
{% endfor %}
"""
trim = true
# HTML comments must never reach a rendered release section: the Release PR
# body lands as the squash commit body, and check-commit rejects `<!--`.
postprocessors = [{ pattern = "(?s)<!--.*?-->", replace = "" }]

[[package]]
name = "cadmus"
release = true
# one canonical changelog at the repo root (not crates/<name>/CHANGELOG.md) —
# README points there and cargo-dist renders the GitHub Release body from it
changelog_path = "CHANGELOG.md"
